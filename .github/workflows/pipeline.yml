
name: SuperKart MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: write


jobs:

  # ==========================================================
  # JOB 1: Register Dataset
  # ==========================================================
  register-dataset:

    name: Register Dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SuperKart/deployment/requirements.txt


      - name: Register dataset
        run: |
          python SuperKart/model_building/data_register.py


      - name: Verify registered dataset
        run: |
          test -f SuperKart/data/SuperKart.csv
          echo "Dataset found successfully."
          ls -lh SuperKart/data/SuperKart.csv


      - name: Upload registered dataset
        uses: actions/upload-artifact@v4

        with:
          name: registered-data
          path: SuperKart/data/SuperKart.csv


  # ==========================================================
  # JOB 2: Data Preparation
  # ==========================================================
  data-preparation:

    name: Data Preparation

    needs:
      - register-dataset

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SuperKart/deployment/requirements.txt


      - name: Download registered dataset
        uses: actions/download-artifact@v4

        with:
          name: registered-data
          path: SuperKart/data


      - name: Verify dataset
        run: |
          test -f SuperKart/data/SuperKart.csv
          echo "Dataset available for preparation."
          ls -lh SuperKart/data/SuperKart.csv


      - name: Prepare data
        run: |
          python SuperKart/model_building/prep.py


      - name: Verify train/test files
        run: |
          test -f Xtrain.csv
          test -f Xtest.csv
          test -f ytrain.csv
          test -f ytest.csv

          echo "Data preparation completed successfully."


      - name: Upload train/test splits
        uses: actions/upload-artifact@v4

        with:
          name: data-splits

          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv


  # ==========================================================
  # JOB 3: Model Training
  # ==========================================================
  model-training:

    name: Model Training

    needs:
      - data-preparation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SuperKart/deployment/requirements.txt


      # ------------------------------------------------------
      # Download prepared data
      # ------------------------------------------------------

      - name: Download train/test splits
        uses: actions/download-artifact@v4

        with:
          name: data-splits


      # ------------------------------------------------------
      # Start local MLflow server
      # ------------------------------------------------------

      - name: Start MLflow Tracking Server
        run: |

          nohup mlflow server \
            --host 0.0.0.0 \
            --port 5000 \
            --backend-store-uri sqlite:///mlflow.db \
            --default-artifact-root ./mlruns \
            > mlflow.log 2>&1 &

          echo $! > mlflow.pid

          echo "Waiting for MLflow server..."

          for i in {1..30}; do

            if curl -s http://127.0.0.1:5000/health > /dev/null; then
              echo "MLflow server is ready."
              break
            fi

            sleep 2

          done

          curl -f http://127.0.0.1:5000/health


      # ------------------------------------------------------
      # Train model
      # ------------------------------------------------------

      - name: Train Model
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000

        run: |

          python SuperKart/model_building/train.py


      # ------------------------------------------------------
      # Verify model
      # ------------------------------------------------------

      - name: Verify trained model
        run: |

          test -f SuperKart/deployment/best_superkart_sales_model_v1.joblib

          echo "Trained model created successfully."

          ls -lh \
            SuperKart/deployment/best_superkart_sales_model_v1.joblib


      # ------------------------------------------------------
      # Verify predictions
      # ------------------------------------------------------

      - name: Verify test predictions
        run: |

          test -f SuperKart/model_building/test_predictions.csv

          echo "Test predictions created successfully."

          ls -lh \
            SuperKart/model_building/test_predictions.csv


      # ------------------------------------------------------
      # Upload trained artifacts
      # ------------------------------------------------------

      - name: Upload Model Artifacts
        uses: actions/upload-artifact@v4

        with:
          name: trained-model

          path: |
            SuperKart/deployment/best_superkart_sales_model_v1.joblib
            SuperKart/model_building/test_predictions.csv


      # ------------------------------------------------------
      # Upload MLflow logs
      # ------------------------------------------------------

      - name: Upload MLflow logs
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: mlflow-logs

          path: |
            mlflow.log
            mlflow.db
            mlruns


      # ------------------------------------------------------
      # Commit trained model
      # ------------------------------------------------------

      - name: Commit Trained Model
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"


          git add \
            SuperKart/deployment/best_superkart_sales_model_v1.joblib


          git diff --cached --quiet || \
            git commit \
            -m "Add trained SuperKart sales model [skip ci]"


          git push
